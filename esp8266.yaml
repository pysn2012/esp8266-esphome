---
substitutions:
  name: esp8266
  friendly_name: esp8266

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  min_version: 2026.4.0
  name_add_mac_suffix: true

esp8266:
  board: nodemcuv2
  toolchain: platformio

api:

ota:
  - platform: esphome

logger:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

captive_portal:


# I2C 总线
i2c:
  - id: i2c_bus
    scl: GPIO5
    sda: GPIO4

sensor:
  # ===== AHT20：温度 + 湿度（关键：加 variant）=====
  - platform: aht10
    variant: AHT20
    i2c_id: i2c_bus
    address: 0x38
    temperature:
      name: "1.温度"
      unit_of_measurement: "°C"
      accuracy_decimals: 1
      icon: "mdi:thermometer"
    humidity:
      name: "2.湿度"
      unit_of_measurement: "%"
      accuracy_decimals: 1
      icon: "mdi:water-percent"
    update_interval: 60s

  # ===== BMP280：气压（顺带读它自己的温度做对比）=====
  - platform: bmp280_i2c
    i2c_id: i2c_bus
    address: 0x77             # 日志确认在 0x77，若以后换模块扫到 0x76 就改这里
    temperature:
      name: "4.气压的温度"
      unit_of_measurement: "°C"
      accuracy_decimals: 1
      icon: "mdi:thermometer"
    pressure:
      name: "3.气压"
      unit_of_measurement: "hPa"
      accuracy_decimals: 1
      icon: "mdi:gauge"
    update_interval: 60s

  # WiFi 信号
  - platform: wifi_signal
    name: "5.WIFI信号"
    unit_of_measurement: "dBm"
    update_interval: 60s
    icon: "mdi:wifi"

  # 运行时长
  - platform: uptime
    name: "6.待机时间"
    unit_of_measurement: "h"
    accuracy_decimals: 1
    update_interval: 60s
    filters:
      - multiply: 0.000277778
    icon: "mdi:timer-outline"



