---
substitutions:
  name: esp8266
  friendly_name: esp8266

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  min_version: 2026.4.0
  name_add_mac_suffix: true

esp8266:
  board: nodemcuv2
  toolchain: platformio

api:

ota:
  - platform: esphome

logger:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

captive_portal:


# I2C 总线
i2c:
  - id: i2c_bus
    scl: GPIO5
    sda: GPIO4

sensor:
  - platform: aht10
    temperature:
      name: "ESP8266_AHT10_Temperature"
      unit_of_measurement: "°C"
      accuracy_decimals: 1
      icon: "mdi:thermometer"
    humidity:
      name: "ESP8266_AHT10_Humidity"
      unit_of_measurement: "%"
      accuracy_decimals: 1
      icon: "mdi:water-percent"
    update_interval: 60s

  - platform: wifi_signal
    name: "ESP8266_WiFi_Signal"
    unit_of_measurement: "dBm"
    update_interval: 60s
    icon: "mdi:wifi"

  - platform: uptime
    name: "ESP8266_Uptime"
    unit_of_measurement: "h"
    accuracy_decimals: 1
    update_interval: 60s
    filters:
      - multiply: 0.000277778
    icon: "mdi:timer-outline"


